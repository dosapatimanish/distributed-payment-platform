spring.application.name=conversion-orchestrator
server.port=8083

management.endpoints.web.exposure.include=health,info,prometheus

# --- Metrics (Grafana + Prometheus, design doc 5.4) ---
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

# --- Datasource (shared local Oracle Database Free 23ai via docker-compose, see backend/docker-compose.yml) ---
# One shared instance (host port 1521, service name paymentdb); this service connects as its own
# Oracle user orchestrator_app (created by backend/oracle-init/), so its schema is isolated.
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/paymentdb
spring.datasource.username=orchestrator_app
spring.datasource.password=orchestrator_app_pw
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Flyway (db/migration/V1__init.sql) now owns the schema - ddl-auto=validate, same reasoning as
# wallet-service's application.properties comment.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# --- Idempotency-Key (design doc 6.2.3), backed by Redis - shared instance, see docker-compose ---
spring.data.redis.host=localhost
spring.data.redis.port=6379
orchestrator.idempotency.ttl-hours=24
orchestrator.idempotency.key-prefix=orchestrator:idem:

# --- Downstream services this orchestrator calls synchronously (design doc 5.3) ---
orchestrator.wallet-service.base-url=http://localhost:8081
orchestrator.fx-rate-service.base-url=http://localhost:8082
orchestrator.merchant-payment-service.base-url=http://localhost:8084
orchestrator.ledger-service.base-url=http://localhost:8085

# --- Ledger posting (design doc 5.3 steps 10a/11b) - synthetic account absorbing the FX spread
# between a conversion's source-currency debit and destination-currency credit, see
# ConversionService.recordLedgerEntries's javadoc. Not a real customer account - the SC prefix
# (vs the numeric customer account numbers) keeps it distinct; see identifier-scheme.md.
orchestrator.ledger.clearing-account-id=SC0000000000

# --- Bank business date (unit_master) - rolled forward by BusinessDateRollJob on this cron.
# Default midnight daily; override to roll faster in a demo.
unit.business-date.roll-cron=0 0 0 * * *
