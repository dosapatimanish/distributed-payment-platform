spring.application.name=conversion-orchestrator
server.port=8083

management.endpoints.web.exposure.include=health,info,prometheus

# --- Metrics (Grafana + Prometheus, design doc 5.4) ---
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

# --- Datasource (local Postgres via docker-compose, see backend/docker-compose.yml) ---
# Own container/port (5436) - 5432/5433/5434/5435 already taken by other local containers.
spring.datasource.url=jdbc:postgresql://localhost:5436/saga_db
spring.datasource.username=orchestrator_app
spring.datasource.password=orchestrator_app_pw

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# --- Idempotency-Key (design doc 6.2.3), backed by Redis - shared instance, see docker-compose ---
spring.data.redis.host=localhost
spring.data.redis.port=6379
orchestrator.idempotency.ttl-hours=24
orchestrator.idempotency.key-prefix=orchestrator:idem:

# --- Downstream services this orchestrator calls synchronously (design doc 5.3) ---
orchestrator.wallet-service.base-url=http://localhost:8081
orchestrator.fx-rate-service.base-url=http://localhost:8082
orchestrator.merchant-payment-service.base-url=http://localhost:8084
orchestrator.ledger-service.base-url=http://localhost:8085

# --- Ledger posting (design doc 5.3 steps 10a/11b) - synthetic account absorbing the FX spread
# between a conversion's source-currency debit and destination-currency credit, see
# ConversionService.recordLedgerEntries's javadoc. Not a real wallet - just a walletId string as
# far as ledger-service is concerned.
orchestrator.ledger.clearing-account-id=SYSTEM-FX-CLEARING
