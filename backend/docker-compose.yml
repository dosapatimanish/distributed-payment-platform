services:
  wallet-postgres:
    image: postgres:16-alpine
    container_name: wallet-postgres
    environment:
      POSTGRES_DB: wallet_db
      POSTGRES_USER: wallet_app
      POSTGRES_PASSWORD: wallet_app_pw
    ports:
      - "5432:5432"
    volumes:
      - wallet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_app -d wallet_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  fxrate-postgres:
    image: postgres:16-alpine
    container_name: fxrate-postgres
    environment:
      POSTGRES_DB: fxrate_db
      POSTGRES_USER: fxrate_app
      POSTGRES_PASSWORD: fxrate_app_pw
    ports:
      # Host port 5435, not 5432 - runs alongside wallet-postgres without clashing.
      - "5435:5432"
    volumes:
      - fxrate_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fxrate_app -d fxrate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  orchestrator-postgres:
    image: postgres:16-alpine
    container_name: orchestrator-postgres
    environment:
      POSTGRES_DB: saga_db
      POSTGRES_USER: orchestrator_app
      POSTGRES_PASSWORD: orchestrator_app_pw
    ports:
      # Host port 5436 - 5432/5433/5434/5435 already taken locally.
      - "5436:5432"
    volumes:
      - orchestrator_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator_app -d saga_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-postgres:
    image: postgres:16-alpine
    container_name: payment-postgres
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment_app
      POSTGRES_PASSWORD: payment_app_pw
    ports:
      # Host port 5437 - 5432/5433/5434/5435/5436 already taken locally.
      - "5437:5432"
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_app -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ledger-postgres:
    image: postgres:16-alpine
    container_name: ledger-postgres
    environment:
      POSTGRES_DB: ledger_db
      POSTGRES_USER: ledger_app
      POSTGRES_PASSWORD: ledger_app_pw
    ports:
      # Host port 5438 - 5432/5433/5434/5435/5436/5437 already taken locally.
      - "5438:5432"
    volumes:
      - ledger_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_app -d ledger_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Shared platform infra (design doc's system diagram groups Redis with the shared
  # infrastructure, not owned per-service like Postgres) - both wallet-service and
  # fx-rate-service connect to this one instance for Idempotency-Key storage, each under its
  # own key prefix (wallet:idem: / fxrate:idem:) so the two services can't collide.
  redis:
    image: redis:7-alpine
    container_name: platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Shared platform infra (design doc §6.5) - single-node KRaft mode (no Zookeeper needed),
  # good enough for local dev. Both wallet-service and fx-rate-service publish to this broker;
  # topics are auto-created on first publish (no explicit provisioning yet - see implementation
  # notes' Kafka Events section for what's deferred).
  kafka:
    image: apache/kafka:3.9.0
    container_name: platform-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"

  # Observability (design doc 5.4) - scrapes /actuator/prometheus off every service, which run on
  # the host (not their own containers - see each service's "How to run it locally"), so this
  # container needs host.docker.internal. extra_hosts makes that resolve on Linux too, not just
  # Docker Desktop (Windows/Mac already provide it built in - this entry is a no-op there).
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: platform-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Auto-provisioned with the Prometheus datasource above and the platform-overview dashboard
  # (backend/observability/grafana/dashboards) - no manual setup needed, just log in and open it.
  grafana:
    image: grafana/grafana:11.4.0
    container_name: platform-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  wallet_postgres_data:
  fxrate_postgres_data:
  orchestrator_postgres_data:
  payment_postgres_data:
  ledger_postgres_data:
  redis_data:
  grafana_data:
