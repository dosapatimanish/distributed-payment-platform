spring.application.name=fx-rate-service
server.port=8082

# Actuator: expose health endpoint for now (matches wallet-service's current setup)
management.endpoints.web.exposure.include=health,info

# --- Datasource (local Postgres via docker-compose, see backend/docker-compose.yml) ---
# Own container/port (5435) so it can run alongside wallet-postgres (5432) without clashing.
spring.datasource.url=jdbc:postgresql://localhost:5435/fxrate_db
spring.datasource.username=fxrate_app
spring.datasource.password=fxrate_app_pw

# --- JPA / Hibernate ---
# ddl-auto=update: same deliberate, temporary choice as wallet-service - fine while the schema
# is still moving; replace with Flyway once it stabilizes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# --- Simulated rate feed (design doc 6.3.2 RateRefreshScheduler) ---
# No external provider wired yet (deliberate - see implementation notes); this generates a
# small random walk around each pair's seed rate on every tick instead.
fx.rate.refresh-interval-ms=1000
# Tracked pairs as base:quote:seedRate
fx.rate.pairs=USD:INR:83.0000,USD:EUR:0.9200,EUR:INR:90.0000,USD:GBP:0.7900

# --- Rate lock (design doc 6.1.2 fx_rate_lock, 6.4) ---
# How long a locked rate stays valid before a caller must consume or re-lock it.
fx.rate.lock.ttl-seconds=10

# --- Idempotency-Key (design doc 6.2.3), backed by Redis - shared instance, see docker-compose ---
spring.data.redis.host=localhost
spring.data.redis.port=6379
fx.idempotency.ttl-hours=24
# Namespaces this service's keys in the shared Redis instance so they can't collide with
# wallet-service's (which uses wallet:idem:).
fx.idempotency.key-prefix=fxrate:idem:

# --- Kafka event publishing (design doc 6.5) ---
spring.kafka.bootstrap-servers=localhost:9092
# See wallet-service's application.properties for why plain strings, not spring-kafka's
# built-in JsonSerializer (Jackson 2, incompatible with this project's Jackson 3 setup).
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
