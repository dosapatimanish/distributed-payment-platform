spring.application.name=ledger-service
server.port=8085

management.endpoints.web.exposure.include=health,info,prometheus

# --- Metrics (Grafana + Prometheus, design doc 5.4) ---
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

# --- Datasource (shared local Oracle Database Free 23ai via docker-compose, see backend/docker-compose.yml) ---
# One shared instance (host port 1521, service name paymentdb); this service connects as its own
# Oracle user ledger_app (created by backend/oracle-init/), so its schema is isolated.
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/paymentdb
spring.datasource.username=ledger_app
spring.datasource.password=ledger_app_pw
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Flyway (db/migration/V1__init.sql) now owns the schema - ddl-auto=validate, same reasoning as
# wallet-service's application.properties comment.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# --- Idempotency-Key (design doc 6.2.3), backed by Redis - shared instance, see docker-compose ---
spring.data.redis.host=localhost
spring.data.redis.port=6379
ledger.idempotency.ttl-hours=24
ledger.idempotency.key-prefix=ledger:idem:

# --- Logging (design doc 5.4) ---
# Appenders live in logback-spring.xml: a console appender plus a time-based rolling file under
# ./logs that rolls once per hour (one file per clock hour, ~7 days kept). Only per-logger
# levels are set here so they stay overridable via env vars / --args without touching the XML.
logging.level.com.paymentplatform=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
