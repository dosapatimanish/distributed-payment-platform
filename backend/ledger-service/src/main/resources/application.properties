spring.application.name=ledger-service
server.port=8085

management.endpoints.web.exposure.include=health,info,prometheus

# --- Metrics (Grafana + Prometheus, design doc 5.4) ---
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

# --- Datasource (local Postgres via docker-compose, see backend/docker-compose.yml) ---
# Own container/port (5438) - 5432/5433/5434/5435/5436/5437 already taken by other local containers.
spring.datasource.url=jdbc:postgresql://localhost:5438/ledger_db
spring.datasource.username=ledger_app
spring.datasource.password=ledger_app_pw

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# --- Idempotency-Key (design doc 6.2.3), backed by Redis - shared instance, see docker-compose ---
spring.data.redis.host=localhost
spring.data.redis.port=6379
ledger.idempotency.ttl-hours=24
ledger.idempotency.key-prefix=ledger:idem:
