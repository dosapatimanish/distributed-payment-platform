spring.application.name=merchant-payment-service
server.port=8084

management.endpoints.web.exposure.include=health,info,prometheus

# --- Metrics (Grafana + Prometheus, design doc 5.4) ---
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

# --- Datasource (local Postgres via docker-compose, see backend/docker-compose.yml) ---
# Own container/port (5437) - 5432/5433/5434/5435/5436 already taken by other local containers.
spring.datasource.url=jdbc:postgresql://localhost:5437/payment_db
spring.datasource.username=payment_app
spring.datasource.password=payment_app_pw

# Flyway (db/migration/V1__init.sql) now owns the schema - ddl-auto=validate, same reasoning as
# wallet-service's application.properties comment.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# --- Idempotency-Key (design doc 6.2.3), backed by Redis - shared instance, see docker-compose ---
spring.data.redis.host=localhost
spring.data.redis.port=6379
merchantpayment.idempotency.ttl-hours=24
merchantpayment.idempotency.key-prefix=merchantpayment:idem:

# --- Kafka event publishing (design doc 6.5) ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# --- Mock acquirer (no real external payment provider wired in yet - see implementation notes) ---
# A charge for exactly this merchantId is deterministically declined; every other merchantId is
# approved. Lets payment.failed / a declined-payment path actually be exercised on demand.
merchantpayment.acquirer.decline-merchant-id=acct-decline
