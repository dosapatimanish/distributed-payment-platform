global:
  scrape_interval: 15s

# Every service exposes /actuator/prometheus on its own port (see each service's
# application.properties - management.endpoints.web.exposure.include). Services run on the host
# via `./mvnw spring-boot:run`, not as their own docker-compose containers (see each service's
# implementation notes' "How to run it locally"), so this container reaches them at
# host.docker.internal - see docker-compose.yml's extra_hosts entry on the prometheus service for
# why that resolves on Linux too, not just Docker Desktop.
scrape_configs:
  - job_name: wallet-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]

  - job_name: fx-rate-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]

  - job_name: conversion-orchestrator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8083"]

  - job_name: merchant-payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8084"]

  - job_name: ledger-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8085"]
