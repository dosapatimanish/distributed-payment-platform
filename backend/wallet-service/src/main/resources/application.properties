spring.application.name=wallet-service
server.port=8081

# Actuator: expose health endpoint for now (more added as we build out the service)
management.endpoints.web.exposure.include=health,info

# --- Datasource (local Postgres via docker-compose, see backend/docker-compose.yml) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/wallet_db
spring.datasource.username=wallet_app
spring.datasource.password=wallet_app_pw

# --- JPA / Hibernate ---
# ddl-auto=update: fine while we are iterating on the schema in this learning phase - Hibernate
# creates/adds tables and columns automatically from the entities below. It never safely drops or
# renames columns, so once the schema stabilizes this must be replaced with real migrations
# (Flyway) - this is a deliberate, temporary choice, not an oversight.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# Pessimistic lock wait timeout (ms), used by WalletRepository#findByIdForUpdate's
# SELECT ... FOR UPDATE on high-contention wallets - a stalled request fails fast instead of
# queuing forever.
spring.jpa.properties.jakarta.persistence.lock.timeout=3000

# How long a wallet reservation (hold) stays valid before it is considered stale
wallet.reservation.ttl-minutes=15
