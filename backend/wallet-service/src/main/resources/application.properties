spring.application.name=wallet-service
server.port=8081

# Actuator: expose health endpoint for now (more added as we build out the service)
management.endpoints.web.exposure.include=health,info,prometheus

# --- Metrics (Grafana + Prometheus, design doc 5.4) ---
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

# --- Datasource (shared local Oracle Database Free 23ai via docker-compose, see backend/docker-compose.yml) ---
# jdbc:oracle:thin:@//host:port/service - one shared instance (host port 1521, service name
# paymentdb = the pluggable DB); each service connects as its own Oracle user, so its schema and
# its flyway_schema_history are separate. The user is created by backend/oracle-init/.
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/paymentdb
spring.datasource.username=wallet_app
spring.datasource.password=wallet_app_pw
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# --- JPA / Hibernate ---
# Flyway (db/migration/V1__init.sql) now owns the schema - ddl-auto=validate makes Hibernate
# check the entities still match what Flyway actually created at startup, rather than silently
# creating/altering anything itself (that's what ddl-auto=update used to do here; replaced now
# that the schema has stabilized enough for real migrations to be worth it).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# Pessimistic lock wait timeout (ms), used by WalletRepository#findByIdForUpdate's
# SELECT ... FOR UPDATE on high-contention wallets - a stalled request fails fast instead of
# queuing forever.
spring.jpa.properties.jakarta.persistence.lock.timeout=3000

# How long a wallet reservation (hold) stays valid before it is considered stale
wallet.reservation.ttl-minutes=15

# --- Idempotency-Key (design doc 6.2.3), backed by Redis - shared instance, see docker-compose ---
spring.data.redis.host=localhost
spring.data.redis.port=6379
# How long a completed (or in-progress) idempotency key is remembered before Redis expires it.
wallet.idempotency.ttl-hours=24
# Namespaces this service's keys in the shared Redis instance so they can't collide with
# fx-rate-service's (which uses fxrate:idem:).
wallet.idempotency.key-prefix=wallet:idem:

# --- Kafka event publishing (design doc 6.5) ---
spring.kafka.bootstrap-servers=localhost:9092
# Plain strings for both key and value, not spring-kafka's built-in JsonSerializer - that class
# is still Jackson 2 (com.fasterxml.jackson.databind) as of spring-kafka 4.1.1, incompatible
# with this project's Jackson 3 (tools.jackson) setup. WalletEventPublisher does its own
# ObjectMapper.writeValueAsString(...) before calling KafkaTemplate.send(...), same pattern
# IdempotencyGuard already uses for Redis.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# --- Logging (design doc 5.4) ---
# Appenders live in logback-spring.xml: a console appender plus a time-based rolling file under
# ./logs that rolls once per hour (one file per clock hour, ~7 days kept). Only per-logger
# levels are set here so they stay overridable via env vars / --args without touching the XML.
logging.level.com.paymentplatform=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
